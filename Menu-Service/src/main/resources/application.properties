spring.application.name=menu-service
server.port=8082

# База данных
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/menu-service-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shba2309}

# JPA: таблицы создаёт только Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health