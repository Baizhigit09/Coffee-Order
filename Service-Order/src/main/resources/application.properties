spring.application.name=order-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/order-service-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# адрес Menu-service и таймауты вызова
menu.service.url=${MENU_SERVICE_URL:http://localhost:8082}
menu.client.connect-timeout-ms=2000
menu.client.read-timeout-ms=3000

management.endpoints.web.exposure.include=health